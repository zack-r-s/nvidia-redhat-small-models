name: Hackathon FODO Ring
project_name: hackring
provider: vllm
# Match the README install; d639869 is unreleased, so the default "local" pin fails.
osprey_install: "osprey-framework @ git+https://github.com/als-apg/osprey.git@d639869"

# Minimal tool-calling agent: one model, one controls server, no workflows.
hooks: [writes-check, limits, memory-guard, approval]
rules: [facility]
skills: []
agents: []
output_styles: []
web_panels: []

data: data

config:
  control_system.type: virtual_accelerator
  control_system.connector.virtual_accelerator.serving: in_process
  control_system.writes_enabled: true
  approval.enabled: false
  approval.default_policy: always
  archiver.type: mock_archiver
  claude_code.telemetry.enabled: false
  hooks.debug: false
  claude_code.servers.controls.enabled: true
  claude_code.servers.archiver.enabled: false
  claude_code.servers.logbook.enabled: false
  claude_code.servers.python.enabled: false
  claude_code.servers.ariel.enabled: false
  claude_code.servers.osprey_facility_knowledge.enabled: false
  claude_code.servers.osprey_workspace.enabled: false
  claude_code.servers.channel-finder.enabled: false
  # Web Terminal runs the small-model agent instead of claude. The PTY starts in build/,
  # and `env` lets a relative interpreter path stand in for the absolute one Osprey requires.
  web_terminal.shell: [env, ../.venv/bin/python, -I, ../scripts/small_agent.py]
  # Built-in Claude Code tools a small model never needs; denied tools drop out of the tool list.
  claude_code.permissions.deny: [Agent, Artifact, ArtifactComments, ArtifactData, AskUserQuestion, CronCreate, CronDelete, CronList, DesignSync, EnterPlanMode, ExitPlanMode, ExitWorktree, ListAgents, NotebookEdit, PushNotification, ReportFindings, ScheduleWakeup, SendFeedback, SendMessage, Skill, TaskCreate, TaskGet, TaskList, TaskStop, TaskUpdate, Workflow, mcp__ide__getDiagnostics, ListMcpResourcesTool, ReadMcpResourceDirTool, ReadMcpResourceTool]
