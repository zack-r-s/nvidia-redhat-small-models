hackring_mark_iv_resources_server:
  resources_servers:
    hackring_mark_iv:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Frozen Mark IV natural operator prompts on a seeded PyAT ring
hackring_mark_iv_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: hackring_mark_iv_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 5
      datasets:
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/hackring_mark_iv/data/validation.jsonl
        license: Apache 2.0
