[project]
name = "osprey-fodo-hack"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "accelerator-toolbox>=0.9,<0.10",
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=2",
  "prompt_toolkit>=3",
  "pyepics>=3.5",
  "PyYAML>=6",
  "uvicorn>=0.30",
  "xopt>=3,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackring"]
