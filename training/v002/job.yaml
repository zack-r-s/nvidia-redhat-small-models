project_name: hackring-control-v002
model_name: LiquidAI/LFM2.5-230M
training_type: sft

dataset:
  train_path: ../../datasets/v003/train.jsonl
  val_path: ../../datasets/v003/validation.jsonl
  type: sft

training_config:
  extends: DEFAULT_SFT
  max_length: 3072
  drop_overlength: true
  assistant_only_loss: true
  packing: false
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  warmup_ratio: 0.05
  save_strategy: epoch
  eval_strategy: epoch
  save_total_limit: 2
  dataloader_num_workers: 0
  bf16: false
  fp16: false
  report_to: none

peft_config:
  extends: DEFAULT_LORA
  use_peft: true
